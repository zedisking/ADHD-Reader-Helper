<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHD Reading Helper</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --accent: #0f3460;
      --highlight: #e94560;
      --text: #eaeaea;
      --muted: #a0a0a0;
    }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
    }
    h2 {
      font-size: 1rem;
      margin: 0 0 0.75rem;
      color: var(--highlight);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .row label { flex: 0 0 70px; font-size: 0.9rem; }
    input[type="range"] {
      flex: 1;
      accent-color: var(--highlight);
    }
    .strength-val { font-weight: 600; min-width: 1.25rem; }
    .btn {
      display: block;
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.75rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      text-align: center;
    }
    .btn:hover { background: var(--accent); }
    .btn-upload { background: var(--highlight); color: white; border-color: var(--highlight); }
    .toggle-row { margin-bottom: 0.5rem; }
    .toggle-row input { accent-color: var(--highlight); }
  </style>
</head>
<body>
  <h2>ADHD Reading Helper</h2>
  <div class="toggle-row">
    <input type="checkbox" id="enabled" checked>
    <label for="enabled">Enabled</label>
  </div>
  <div class="row">
    <label for="strength">Strength:</label>
    <input type="range" id="strength" min="1" max="5" value="3" step="1">
    <span class="strength-val" id="strengthVal">3</span>
  </div>
  <a href="reader.html" class="btn btn-upload" target="_blank">Upload document</a>
  <a href="settings.html" class="btn" target="_blank">Open Settings</a>
  <script src="popup.js"></script>
</body>
</html>
